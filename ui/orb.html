<!doctype html><meta charset="utf-8">
<style>html, body { margin: 0; background: transparent; overflow: hidden } canvas { width: 26px; height: 26px }</style>
<canvas></canvas><script>
// "Breathing" orb for aimouse.py, the same drawing as orbElements in hammerspoon.lua. Ported from
// thinking-orbs by Jakub Antalik (MIT): https://github.com/Jakubantalik/thinking-orbs (ring mode, size 20)
const ORB = 20, W = ORB + 6, LANES = 8, SEGS = 15, WOB = 0.565, SPEED = 3.78, RBASE = 1.7842, RDEPTH = 2.7574
const RS = (ORB / 300) ** 0.6, R = ORB / 2 * 0.78, BASE_R = R / (1 + 0.85 * 0.23 * WOB)
const CT = Math.cos(0.3), ST = Math.sin(0.3), F1 = 2 * Math.PI / SPEED, F2 = 4 * Math.PI / 3 / SPEED
const dark = matchMedia("(prefers-color-scheme: dark)"), c = document.querySelector("canvas")
const g = c.getContext("2d"), k = devicePixelRatio || 1, start = performance.now()
c.width = c.height = W * k
g.scale(k, k)
// "Listening" (aimouse.py sets it while Win+Alt+S is held): a waveform rolls through the rings of a
// dotted sphere, thinking-orbs' wave mode at its size-20 preset
let listening = false
const WAVE_R = ORB / 2 * 0.874, RINGS = 5, LON = 13, WSPEED = 3.998, WRBASE = 0.6 * 1.6, WRDEPTH = 1.7 * 1.6
const WCT = Math.cos(0.38), WST = Math.sin(0.38)
function waveDots(t) {
  const dots = [], cy = Math.cos(t * 0.18), sy = Math.sin(t * 0.18)
  for (let ri = 0; ri <= RINGS; ri++) {
    const lat = -Math.PI / 2 + ri / RINGS * Math.PI
    const w = 0.62 * Math.sin(t * 2.1 - ri * 0.52) + 0.38 * Math.sin(t * 1.27 + ri * 0.83)
    const rr = WAVE_R * (0.88 + 0.105 * w), crest = Math.max(0, w)
    const n = Math.max(1, Math.round(Math.abs(Math.cos(lat)) * LON))
    for (let j = 0; j < n; j++) {
      const lon = j / n * 2 * Math.PI
      let x = Math.cos(lat) * Math.cos(lon) * rr, y = Math.sin(lat) * rr, z = Math.cos(lat) * Math.sin(lon) * rr
      ;[x, z] = [x * cy + z * sy, -x * sy + z * cy]
      const depth = ((y * WST + z * WCT) / WAVE_R + 1) / 2
      dots.push([depth, W / 2 + x, W / 2 - (y * WCT - z * WST),
                 Math.max(0.3, (WRBASE + WRDEPTH * depth) * (1 + 0.4 * crest) * RS), 0.66 - 0.56 * depth - 0.1 * crest, 1])
    }
  }
  return dots
}
function frame(now) {
  const d = dark.matches
  const dots = listening ? waveDots((now - start) / 1000 * WSPEED) : ringDots((now - start) / 1000 * SPEED)
  dots.sort((p, q) => p[0] - q[0])  // far dots first
  g.clearRect(0, 0, W, W)
  g.shadowBlur = 0.6 * k  // glow keeps the dots visible on any background
  g.shadowColor = d ? "rgba(0,0,0,.35)" : "rgba(255,255,255,.35)"
  for (const [, x, y, r, ink, alpha] of dots) {
    const v = (d ? 1 - ink : ink) * 255
    g.fillStyle = `rgba(${v},${v},${v},${alpha})`
    g.beginPath(); g.arc(x, y, r, 0, 2 * Math.PI); g.fill()
  }
  requestAnimationFrame(frame)
}
function ringDots(t) {
  const mid = (LANES - 1) / 2, dots = []
  for (let w = 0; w < LANES; w++) {
    const off = (w - mid) * 0.075, edge = Math.abs(w - mid) / mid
    for (let s = 0; s < SEGS; s++) {
      const a = s / SEGS * 2 * Math.PI
      const wob = (0.16 * Math.sin(a * 3 - t * F1 + w * 0.22) + 0.07 * Math.sin(a * 5 + t * F2)) * WOB
      let x = Math.cos(a), y = CT * Math.sin(a) + ST * off, z = -ST * Math.sin(a) + CT * off
      const m = BASE_R * (1 + wob) / Math.hypot(x, y, z)
      x *= m; y *= m; z *= m
      const depth = ((y * ST + z * CT) / R + 1) / 2, ink = 0.52 - 0.44 * depth + 0.18 * edge
      dots.push([depth, W / 2 + x, W / 2 - (y * CT - z * ST),
                 Math.max(0.3, (RBASE + RDEPTH * depth) * (1 - 0.25 * edge) * RS), ink, 0.4 + 0.6 * depth])
    }
  }
  return dots
}
requestAnimationFrame(frame)
</script>
