<!doctype html><meta charset="utf-8">
<style>html, body { margin: 0; background: transparent; overflow: hidden } canvas { width: 26px; height: 26px }</style>
<canvas></canvas><script>
// "Breathing" orb for aimouse.py, the same drawing as orbElements in hammerspoon.lua. Ported from
// thinking-orbs by Jakub Antalik (MIT): https://github.com/Jakubantalik/thinking-orbs (ring mode, size 20)
const ORB = 20, W = ORB + 6, LANES = 8, SEGS = 15, WOB = 0.565, SPEED = 3.78, RBASE = 1.7842, RDEPTH = 2.7574
const RS = (ORB / 300) ** 0.6, R = ORB / 2 * 0.78, BASE_R = R / (1 + 0.85 * 0.23 * WOB)
const CT = Math.cos(0.3), ST = Math.sin(0.3), F1 = 2 * Math.PI / SPEED, F2 = 4 * Math.PI / 3 / SPEED
const dark = matchMedia("(prefers-color-scheme: dark)"), c = document.querySelector("canvas")
const g = c.getContext("2d"), k = devicePixelRatio || 1, start = performance.now()
c.width = c.height = W * k
g.scale(k, k)
function frame(now) {
  const t = (now - start) / 1000 * SPEED, d = dark.matches, mid = (LANES - 1) / 2, dots = []
  for (let w = 0; w < LANES; w++) {
    const off = (w - mid) * 0.075, edge = Math.abs(w - mid) / mid
    for (let s = 0; s < SEGS; s++) {
      const a = s / SEGS * 2 * Math.PI
      const wob = (0.16 * Math.sin(a * 3 - t * F1 + w * 0.22) + 0.07 * Math.sin(a * 5 + t * F2)) * WOB
      let x = Math.cos(a), y = CT * Math.sin(a) + ST * off, z = -ST * Math.sin(a) + CT * off
      const m = BASE_R * (1 + wob) / Math.hypot(x, y, z)
      x *= m; y *= m; z *= m
      const depth = ((y * ST + z * CT) / R + 1) / 2, ink = 0.52 - 0.44 * depth + 0.18 * edge
      dots.push([depth, W / 2 + x, W / 2 - (y * CT - z * ST),
                 Math.max(0.3, (RBASE + RDEPTH * depth) * (1 - 0.25 * edge) * RS), (d ? 1 - ink : ink) * 255, 0.4 + 0.6 * depth])
    }
  }
  dots.sort((p, q) => p[0] - q[0])  // far dots first
  g.clearRect(0, 0, W, W)
  g.shadowBlur = 0.6 * k  // glow keeps the dots visible on any background
  g.shadowColor = d ? "rgba(0,0,0,.35)" : "rgba(255,255,255,.35)"
  for (const [, x, y, r, v, alpha] of dots) {
    g.fillStyle = `rgba(${v},${v},${v},${alpha})`
    g.beginPath(); g.arc(x, y, r, 0, 2 * Math.PI); g.fill()
  }
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
